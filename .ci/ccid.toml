schema = 1
project = "csgn"

[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["ccid", "first-party"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "clippy", "--locked", "--all-targets", "--no-default-features", "--", "-D", "warnings"],
  ["cargo", "clippy", "--locked", "--all-targets", "--all-features", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["cargo", "test", "--locked", "--all-features"],
  ["cargo", "test", "--locked", "--no-default-features"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown", "--no-default-features"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown", "--all-features"],
  ["bash", "-c", "set -euo pipefail\nCARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime cargo test --locked --target wasm32-wasip1 --no-default-features --test it -- --test-threads=1"],
  ["bash", "-c", "set -euo pipefail\nCARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime cargo test --locked --target wasm32-wasip1 --features volatile-signer --test it -- --test-threads=1"],
  ["ccid", "coverage", "run"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["wasmtime", "--version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["clang", "--version"], ["pkg-config", "--version"]]
cache_env = ["LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["ccid:run-declared-checks"]
events = ["manual"]

[check_shell]

[security]
dependencies = "cargo-deny"

[runtime]
tools = ["wasmtime", "python3", "cargo-deny", "cargo-llvm-cov"]

[toolchain]
nightly = true
targets = ["stable:wasm32-unknown-unknown", "stable:wasm32-wasip1"]

