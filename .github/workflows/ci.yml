name: ci
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve one fresh dependency snapshot
      run: |-
        cargo update
        rustc --version > resolver.txt
        cargo --version >> resolver.txt
        date -u +%FT%TZ >> resolver.txt
        sha256sum Cargo.lock >> resolver.txt
    - uses: actions/upload-artifact@v4
      with:
        name: resolved-lock
        path: |-
          Cargo.lock
          resolver.txt
        retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown, wasm32-wasip1
    - uses: Swatinem/rust-cache@v2
    - run: rustc --version
    - uses: bytecodealliance/actions/wasmtime/setup@v1
    - run: wasmtime --version
    - run: cargo fmt --all --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
    - run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - run: cargo test --locked
    - run: cargo test --locked --all-features
    - run: cargo test --locked --no-default-features
    - run: cargo check --locked --target wasm32-unknown-unknown
    - run: cargo check --locked --target wasm32-unknown-unknown --no-default-features
    - run: cargo check --locked --target wasm32-unknown-unknown --all-features
    - name: Execute verifier vectors on wasm32
      env:
        CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      run: cargo test --locked --target wasm32-wasip1 --no-default-features --test vectors --test ring -- --test-threads=1
    - name: Execute signing vectors and security regressions on wasm32
      env:
        CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      run: cargo test --locked --target wasm32-wasip1 --features volatile-signer --test vectors --test ring --test
        adversarial -- --test-threads=1
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    needs:
    - resolve
  coverage:
    needs:
    - resolve
    - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: |-
        rustc --version
        cargo llvm-cov --version
    - name: Measure real native round trips and failure paths
      run: cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex '/tests/' --json --output-path coverage.json
    - name: Require complete line and branch coverage
      run: python3 .github/check-coverage.py coverage.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: |-
          coverage.json
          Cargo.lock
          resolver.txt
        retention-days: 7
'on':
  push:
    branches:
    - '**'
  pull_request: null
  workflow_dispatch: null
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
