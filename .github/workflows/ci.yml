name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: wasmtime --version
      - name: Resolve dependencies once
        run: |
          if test -f Cargo.lock; then
            cargo fetch --locked
          else
            cargo generate-lockfile
          fi
          python3 scripts/check-dependency-pins.py
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo check --locked --target wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --locked --target wasm32-unknown-unknown --all-features
      - name: Execute verifier vectors on wasm32
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test --locked --target wasm32-wasip1 --no-default-features --test vectors --test ring -- --test-threads=1
      - name: Execute signing vectors and security regressions on wasm32
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test --locked --target wasm32-wasip1 --features volatile-signer --test vectors --test ring --test adversarial -- --test-threads=1
